name: Build and publish Docker image

on:
  push:
    tags:
      - "v*"
    # `edge` follows main, so a deployment can track what is merged without
    # waiting for a release. Tags are what produce a version.
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # No image is published unless lint, mypy and the whole test suite pass.
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./assistant/Dockerfile
          # arm64 is built under emulation and dominates the run, so only a
          # release pays for it — `edge` is amd64 and stays a few minutes.
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the package at build time (assistant/hatch_build.py),
          # not read at run time — the same values the OCI labels carry.
          #
          # Both are tag-only, for different reasons. On a branch build the
          # metadata action's version is the literal "edge", which is not a
          # version any build backend will accept; empty falls back to 0.0.0.
          # And `release` is what telemetry reports from — an image following
          # main is not a release and must not claim to be one.
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/') && steps.meta.outputs.version || '' }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_CHANNEL=${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'edge' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max