name: CI

on:
  pull_request:
  # The gate every publication hangs off — release.yml calls it, and nothing
  # reaches ghcr, Docker Hub or PyPI unless it passes. No push trigger of its
  # own: release.yml runs on a push to main too, and a second trigger would
  # only run the same suite twice.
  workflow_call:
    secrets:
      # A called workflow gets no secrets unless they are handed to it, and
      # without this one the coverage upload below quietly stops working.
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that touches only documentation skips the code jobs below.
  # They are required checks on main, so the workflow itself cannot be skipped
  # with `paths-ignore` — the checks would never report and the PR would wait
  # for them forever. A job skipped by its `if` counts as passed instead. Only
  # a definite "no code" skips: if this job fails, its output is empty and the
  # code jobs run, rather than a broken filter letting code through unchecked.
  # Prompts are `.md` files inside the package, which is why the pattern names
  # the documentation it skips instead of matching every `.md`.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Under workflow_call the event is release.yml's push, and a publication
      # is always gated by the full suite. The diff is taken on its own line so
      # that a failing `git diff` fails the step — inside an `if` it would read
      # as an empty diff, i.e. "no code". `--no-renames` lists both sides of a
      # move, so code moved into docs/ still counts as code removed.
      - name: Diff against the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames "$BASE...$HEAD")
          if printf '%s\n' "$files" \
              | grep -qvE '^(docs/|\.claude/|[^/]+\.md$|assistant/(CLAUDE|README)\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: Lint, type-check, test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact tag: astral-sh does not publish a moving `v9`.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: assistant/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The real type gate is the pre-commit hook: mirrors-mypy runs mypy in its
      # own venv (without langchain & co), which catches things that the more
      # permissive `uv run mypy src` lets through.
      - name: Type check (mypy via pre-commit)
        run: uv run pre-commit run mypy --all-files --show-diff-on-failure

      # `test/integration` is deliberately excluded — it needs a real LLM endpoint.
      - name: Unit tests
        run: uv run pytest --cov-report=xml -o log_cli=false

      # Powers the coverage badge in README.md. Needs the CODECOV_TOKEN repo
      # secret (from codecov.io) — without it this step fails but doesn't
      # block the job, so the badge just stays stale until the secret is set.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: assistant/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The image used to be built only by a tag, which is how a Dockerfile that
  # could not build reached a release. Pull requests only: everything merged
  # gets built by release.yml on its way to `edge`, so building here too would
  # do the same work twice. amd64 and never pushed — a gate, not a publication
  # — sharing the gha cache with the workflow that does publish. amd64 alone
  # because nothing in this build is architecture-specific: no compilation, no
  # dependency outside a wheel. arm64 is proven on every merge into main.
  image:
    name: Build Docker image
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./assistant/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Read the Docs builds and hosts the site; this only guards against a broken
  # build reaching main. `--strict` turns MkDocs warnings (dead links, pages
  # missing from the nav, unreadable files) into a non-zero exit. The doc
  # toolchain is not a project dependency, so it is pulled in ad hoc rather
  # than through uv.lock.
  docs:
    name: Build docs (mkdocs --strict)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      - name: Build
        run: uv run --no-project --with-requirements docs/requirements.txt -- mkdocs build --strict

  ui:
    name: Build admin UI
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build` — this is the TS gate too.
      - name: Build
        run: npm run build
