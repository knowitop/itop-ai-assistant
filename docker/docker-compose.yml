name: itop-ai-assistant
services:
  itop:
    image: vbkunin/itop
    ports:
      - "8000:80"
    volumes:
      - ./itop/conf:/var/www/html/conf/production
      - itop-db:/var/lib/mysql
    environment:
      MYSQL_PASS: 123456

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # Vector store backend (optional): the assistant runs Redis-only until
  # QDRANT_URL is set, so `assistant` deliberately has no depends_on here.
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  assistant:
    image: ghcr.io/knowitop/itop-ai-assistant:latest
#    build:
#      context: ..
#      dockerfile: assistant/Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      - redis
    env_file:
      - .env

volumes:
  itop-db:
  redis-data:
  qdrant_data:
