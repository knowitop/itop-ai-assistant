# https://pre-commit.com/#usage
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: [--select, I, --fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]

  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports
        # pre-commit runs hooks from the git root, one level above this
        # config and .importlinter — pin uv to this project explicitly.
        entry: uv run --directory assistant lint-imports
        language: system
        pass_filenames: false