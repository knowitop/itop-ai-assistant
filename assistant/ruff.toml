# https://docs.astral.sh/ruff/settings
line-length = 120

[lint]
# Enable the isort rules
extend-select = ["I"]

[lint.isort]
# The package is installed into the venv, so without this ruff sorts it with
# the third-party imports.
known-first-party = ["itop_ai_assistant"]

[lint.per-file-ignores]
# conftest must load .env.test before any project import touches get_settings()
"test/integration/agents/intake/conftest.py" = ["E402"]
