[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "itop-ai-assistant"
# The version comes from the git tag at build time and the readme is assembled
# from the repository README (see the fancy-pypi-readme hook below) — neither is
# edited by hand, so neither can drift from what it describes.
dynamic = ["version", "readme"]
description = "AI intake for Combodo iTop: classifies new tickets and asks what is missing"
license = "AGPL-3.0-only"
# A copy of the repository root's LICENSE. AGPL wants its text to travel with
# the work, and hatchling cannot reach above this build root — `license-files`
# pointed at `../LICENSE` fails silently, producing metadata with no
# License-File at all rather than an error.
license-files = ["LICENSE"]
# Nothing here is tested below 3.13 — widening this floor without widening the
# CI matrix would be a promise nothing keeps.
requires-python = ">=3.13"
authors = [{ name = "Vladimir Kunin" }]
keywords = [
    "itop",
    "itsm",
    "servicedesk",
    "helpdesk",
    "ticket-triage",
    "ai",
    "llm",
    "agent",
]
# No "License :: OSI Approved ::" classifier — PyPI rejects one alongside the
# SPDX `license` expression above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-core>=1.2.23",
    "langchain-google-genai>=4.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.1.6",
    "lxml>=5.0.0",
    "markdownify>=0.14.0",
    "pydantic>=2.12.5",
    "pydantic-settings[yaml]>=2.13.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.12.0",
    "redis>=7.4.0",
    "uvicorn>=0.43.0",
]

# The reason this package is on PyPI at all: a page that leads back to the
# project. Docker Compose is how the service is actually installed, so the
# repository is the homepage rather than a landing page of its own.
[project.urls]
Homepage = "https://github.com/knowitop/itop-ai-assistant"
Repository = "https://github.com/knowitop/itop-ai-assistant"
Documentation = "https://github.com/knowitop/itop-ai-assistant/tree/main/docs"
Issues = "https://github.com/knowitop/itop-ai-assistant/issues"

# Tracing (TASK-058, ADR-029) — optional by design: a base install pulls none
# of it, and CI runs the suite in exactly that environment. The image installs
# it explicitly (assistant/Dockerfile), which is what makes the pilot able to
# switch tracing on at all. `…-proto-http`, not the umbrella
# `opentelemetry-exporter-otlp`: the umbrella drags in gRPC (`grpcio`), the one
# heavy dependency here, for a transport this service does not speak.
[project.optional-dependencies]
tracing = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "openinference-instrumentation-langchain>=0.1",
]

[tool.hatch.version]
source = "vcs"
# No repository (a source archive, say) — better a flag value than a crash.
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# .git lives at the repository root; this pyproject sits one level down.
root = ".."
# The commit is reported as its own field, so keep it out of the version
# string: "0.3.1.dev7", not "0.3.1.dev7+gde778d1".
local_scheme = "no-local-version"

# Writes src/itop_ai_assistant/_build_info.py — see hatch_build.py.
[tool.hatch.build.hooks.custom]

[tool.hatch.build]
# Both are generated, hence gitignored, and hatchling leaves VCS-ignored files
# out of the artifact unless they are named here. The SPA is a directory and a
# bare path is enough — it goes in recursively, into the wheel and the sdist
# alike, which is what lets `pip install` from the sdist work without Node.
artifacts = [
    "src/itop_ai_assistant/_build_info.py",
    "src/itop_ai_assistant/ui_dist",
]

# The PyPI page is the repository README, not a stub written twice. Its links
# are relative to the repository, which is a 404 on PyPI, so they are rewritten
# to absolute ones here — images through raw.githubusercontent.com, because a
# `blob/` URL serves a HTML page rather than the picture.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "../README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/knowitop/itop-ai-assistant/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)\[([^\]]*)\]\((?!https?://|#)([^)]+)\)'
replacement = '[\1](https://github.com/knowitop/itop-ai-assistant/blob/main/\2)'

[tool.uv]
# Without this uv reuses a cached build after a commit or a new tag, and the
# baked version silently goes stale.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[project.scripts]
itop-ai-reindex = "itop_ai_assistant.vector.use_cases.reindex:main"
itop-ai-provision = "itop_ai_assistant.itop.provisioning:main"

[dependency-groups]
dev = [
    "fakeredis>=2.0.0",
    "import-linter>=2.5",
    "lxml-stubs>=0.5.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "types-pyyaml>=6.0.12.20250915",
]
