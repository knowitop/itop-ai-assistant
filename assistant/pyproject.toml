[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "itop-ai-assistant"
# Derived from the git tag at build time — never edited by hand, so it cannot
# drift from the tag the way a literal here always eventually does.
dynamic = ["version"]
description = "iTop AI Assistant"
# SPDX expression only: the license text lives in the repository root, outside
# this package's build root, and hatchling cannot reach above it.
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-core>=1.2.23",
    "langchain-google-genai>=4.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.1.6",
    "lxml>=5.0.0",
    "markdownify>=0.14.0",
    "pgvector>=0.4.0",
    "pydantic>=2.12.5",
    "pydantic-settings[yaml]>=2.13.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.12.0",
    "redis>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.43.0",
]

[tool.hatch.version]
source = "vcs"
# No repository (a source archive, say) — better a flag value than a crash.
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# .git lives at the repository root; this pyproject sits one level down.
root = ".."
# The commit is reported as its own field, so keep it out of the version
# string: "0.3.1.dev7", not "0.3.1.dev7+gde778d1".
local_scheme = "no-local-version"

# Writes src/itop_ai_assistant/_build_info.py — see hatch_build.py.
[tool.hatch.build.hooks.custom]

[tool.hatch.build]
# The stamp is generated, hence gitignored, and hatchling leaves VCS-ignored
# files out of the artifact unless they are named here.
artifacts = ["src/itop_ai_assistant/_build_info.py"]

[tool.uv]
# Without this uv reuses a cached build after a commit or a new tag, and the
# baked version silently goes stale.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[project.scripts]
itop-ai-reindex = "itop_ai_assistant.vector.reindex:main"
itop-ai-provision = "itop_ai_assistant.itop_provisioning:main"

[dependency-groups]
dev = [
    "fakeredis>=2.0.0",
    "lxml-stubs>=0.5.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "testcontainers[postgres]>=4.13.0",
    "types-pyyaml>=6.0.12.20250915",
]
